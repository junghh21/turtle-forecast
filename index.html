<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거북이 예보</title>
<meta name="description" content="LLM 다섯 곳의 S&P 500·나스닥·TLT·BOIL·KOSPI 시간별 방향 예측과 적중 기록">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E99">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#E6EBEF; --ink:#0D1922; --muted:#5D6D7A; --line:#D7DFE6;
  --accent:#0B6E99; --accent-soft:#DDEFF7; --up:#0E8A5D; --up-soft:#DDF3E9; --down:#CF3D33; --down-soft:#FBE5E3; --wait:#8C99A4;
  --shadow:0 1px 2px rgba(13,25,34,.05),0 8px 24px rgba(13,25,34,.06);
  --g:#3B82C4; --q:#7A5AF8; --d:#0F9488; --k:#D97706; --x:#DB2777;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1116; --surface:#111B22; --sunk:#0D161C; --ink:#E4EBF0; --muted:#8B9CA9; --line:#203039;
    --accent:#58B8E4; --accent-soft:#103042; --up:#3ECD8E; --up-soft:#0E2C21; --down:#FF6F62; --down-soft:#371815; --wait:#6C7C88;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
    --g:#6AA8E0; --q:#A08BFF; --d:#2DC4B4; --k:#F2A33A; --x:#F062A6;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1116; --surface:#111B22; --sunk:#0D161C; --ink:#E4EBF0; --muted:#8B9CA9; --line:#203039;
  --accent:#58B8E4; --accent-soft:#103042; --up:#3ECD8E; --up-soft:#0E2C21; --down:#FF6F62; --down-soft:#371815; --wait:#6C7C88;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  --g:#6AA8E0; --q:#A08BFF; --d:#2DC4B4; --k:#F2A33A; --x:#F062A6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding-inline:16px}
.wrap{max-width:1200px;margin:0 auto;padding-block:18px 48px;display:grid;gap:18px}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-right:auto;display:flex;gap:8px;align-items:center}
.turtle{display:inline-block;animation:crawl 6s ease-in-out infinite}
@keyframes crawl{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pill b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--wait);position:relative}
.dot.live{background:var(--up)}
.dot.live::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--up);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(1.8);opacity:0}}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--ink)}
.ticker{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;height:38px}
.ticker .track{display:flex;gap:36px;white-space:nowrap;position:absolute;top:0;left:0;height:100%;align-items:center;padding-left:16px;animation:scroll var(--dur,80s) linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker a{color:var(--ink);text-decoration:none;font-size:13px}
.ticker a:hover{color:var(--accent)}
.ticker .t{color:var(--muted);font-size:11.5px;margin-right:6px;font-family:'IBM Plex Mono',monospace}
@keyframes scroll{to{transform:translateX(-50%)}}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:grid;gap:8px;cursor:pointer;text-align:left;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.card:hover{transform:translateY(-3px)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.card .nm{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.card h3{font-size:15px;font-weight:700}
.card .chg{font-size:12px;font-weight:600}
.up-t{color:var(--up)} .down-t{color:var(--down)} .wait-t{color:var(--wait)}
.card .px{font-size:20px;font-weight:600;letter-spacing:-.01em}
.spark{width:100%;height:40px;display:block}
.spark path.ln{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dials{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dial{display:grid;justify-items:center;gap:0}
.dial svg{width:100%;max-width:96px;height:auto;overflow:visible}
.dial .needle{transform-origin:50px 50px;transition:transform 1.1s cubic-bezier(.3,1.4,.4,1)}
.dial .lbl{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.dial .val{font-size:13px;font-weight:700}
.focus{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
@media (max-width:900px){.focus{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;position:relative;min-width:0}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ph h2{font-size:15px;font-weight:700;margin-right:auto}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chart{width:100%;height:300px;display:block;touch-action:none}
.chart text{fill:var(--muted);font:11px 'IBM Plex Mono',monospace}
.chart .ln{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.4s ease forwards}
.mk{cursor:pointer;transition:transform .15s}
.mk:hover{transform:scale(1.5)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;max-width:260px;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:5}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:700}
.board{display:grid;gap:10px}
.row{display:grid;grid-template-columns:78px 1fr 64px;align-items:center;gap:8px;font-size:12.5px}
.row .who{display:flex;align-items:center;gap:6px;font-weight:600}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.track2{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden;position:relative}
.track2 i{position:absolute;inset:0 auto 0 0;border-radius:6px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.track2 .half{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.5}
.row .v{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;transition:opacity .2s,background .2s}
.chip[aria-pressed="false"]{opacity:.4}
.curve{width:100%;height:230px;display:block}
.curve text{fill:var(--muted);font:11px 'IBM Plex Mono',monospace}
.curve .ln{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s ease forwards}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.feed{display:grid;gap:8px;max-height:560px;overflow:auto;padding-right:2px}
.run{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;background:var(--surface);transition:border-color .2s}
.run:hover{border-color:var(--accent)}
.run .hd{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;border:0;background:none;padding:0;text-align:left;width:100%}
.run .hd .t{color:var(--muted);margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mc{background:var(--sunk);border-radius:8px;padding:5px 6px;font-size:11px;display:grid;gap:2px}
.mc .k{color:var(--muted);font-size:10px;font-weight:600}
.mc .p{display:flex;gap:4px;align-items:center;font-family:'IBM Plex Mono',monospace;font-weight:600}
.r{width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;font-size:9px;color:#fff;flex:none}
.r.hit{background:var(--up)} .r.miss{background:var(--down)} .r.wait{background:var(--wait);opacity:.55} .r.na{background:transparent;border:1px dashed var(--wait)}
.more{display:none;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.run.open .more{display:grid;gap:6px}
.more a{color:var(--accent);text-decoration:none}
.more ul{margin:0;padding-left:16px}
.vline{display:flex;align-items:center;gap:0;overflow-x:auto;padding:12px 4px 6px}
.vnode{border:2px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:999px;min-width:42px;height:28px;font:600 12px 'IBM Plex Mono',monospace;cursor:pointer;flex:none;transition:transform .2s,background .2s}
.vnode:hover{transform:scale(1.08)}
.vnode[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.vnode.rej{border-style:dashed;border-color:var(--wait);color:var(--wait);min-width:28px}
.vgap{height:2px;background:var(--line);flex:1 0 24px}
.vbody{display:grid;gap:10px;font-size:13px;animation:rise .35s ease both}
.vbody blockquote{margin:0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 10px 10px 0;white-space:pre-wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:var(--surface)}
a.tag:hover{border-color:var(--accent);color:var(--accent)}
.vmeta{font-size:12px;color:var(--muted)}
.lab{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cand{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-decoration:none;color:var(--ink);transition:transform .2s,border-color .2s;background:var(--surface)}
.cand:hover{transform:translateY(-2px);border-color:var(--accent)}
.ring{flex:none}
.ring circle.fg{transition:stroke-dashoffset 1s ease}
.cand .nm{font-size:12.5px;font-weight:600;line-height:1.3}
.cand .og{font-size:11px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{background:var(--sunk);border-radius:12px;padding:10px;display:grid;gap:2px}
.tile .k{font-size:11px;color:var(--muted)}
.tile .v{font-size:16px;font-weight:600}
.srcs{display:grid;gap:6px;margin-top:10px}
.src{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12.5px}
.src a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src a:hover{color:var(--accent)}
.lenbar{width:90px;height:6px;background:var(--sunk);border-radius:4px;overflow:hidden}
.lenbar i{display:block;height:100%;background:var(--accent);width:0;transition:width 1s ease}
.empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center}
.scs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sc{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--surface);cursor:pointer;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s;animation:rise .5s ease both;animation-delay:calc(var(--i)*60ms)}
.sc:hover{transform:translateY(-2px)}
.sc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sc.retired{opacity:.5}
.sc .hd{display:flex;align-items:center;gap:8px}
.sc .id{font:600 13px 'IBM Plex Mono',monospace}
.badge{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-left:auto;white-space:nowrap}
.sc .ds{font-size:12px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc .rec{display:flex;align-items:center;gap:8px;font-size:12px}
.pu{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pu div{display:grid;gap:3px;font-size:10px;color:var(--muted);text-align:center}
.pu .b{height:28px;background:var(--sunk);border-radius:5px;position:relative;overflow:hidden}
.pu .b::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.pu .b i{position:absolute;left:3px;right:3px;border-radius:3px;transition:all .9s cubic-bezier(.2,.8,.2,1)}
.code{margin:10px 0 0;background:var(--sunk);border-radius:12px;padding:12px 14px;font:12px/1.5 'IBM Plex Mono',monospace;overflow:auto;max-height:340px;white-space:pre;animation:rise .3s ease both}
.more pre{margin:0;background:var(--sunk);border-radius:8px;padding:8px;font:11px/1.45 'IBM Plex Mono',monospace;overflow:auto;max-height:200px;white-space:pre-wrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.foot a{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.spark path.ln,.chart .ln,.curve .ln{stroke-dasharray:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span class="turtle" aria-hidden="true">🐢</span>거북이 예보</h1>
    <span class="pill" id="live"><span class="dot"></span>…</span>
    <span class="pill" id="next">다음 예측 <b class="num">–</b></span>
    <span class="pill" id="count">예측 <b class="num">0</b></span>
    <button class="iconbtn" id="theme" type="button" aria-label="테마 전환">◐</button>
  </div>

  <div class="ticker" aria-label="최근 뉴스"><div class="track" id="ticker"></div></div>

  <div class="cards" id="cards"></div>

  <div class="focus">
    <div class="panel">
      <div class="ph"><h2 id="f-title">–</h2>
        <div class="seg" id="f-hz"><button type="button" data-hz="1h" aria-pressed="true">1시간</button><button type="button" data-hz="close" aria-pressed="false">종가</button></div>
      </div>
      <svg class="chart" id="chart" role="img" aria-label="가격과 예측 표시"></svg>
      <div class="tip" id="tip"></div>
    </div>
    <div class="panel">
      <div class="ph"><h2>적중률</h2><span class="vmeta" id="b-sub"></span></div>
      <div class="board" id="board"></div>
    </div>
  </div>

  <div class="panel">
    <div class="ph"><h2>누적 적중률</h2>
      <div class="chips" id="llms"></div>
      <div class="seg" id="c-hz"><button type="button" data-hz="1h" aria-pressed="true">1시간</button><button type="button" data-hz="close" aria-pressed="false">종가</button></div>
    </div>
    <svg class="curve" id="curve" role="img" aria-label="LLM별 누적 적중률"></svg>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="ph"><h2>예측 기록</h2></div>
      <div class="feed" id="feed"></div>
    </div>
    <div class="panel" style="display:grid;gap:14px;align-content:start">
      <div><div class="ph"><h2>전략 진화</h2></div><div class="vline" id="vline"></div><div id="vbody"></div></div>
      <div><div class="ph"><h2>수집 데이터</h2><span class="vmeta" id="c-at"></span></div><div class="tiles" id="tiles"></div><div class="srcs" id="srcs"></div></div>
    </div>
  </div>

  <div class="panel">
    <div class="ph"><h2>스크립트</h2><span class="vmeta" id="sc-sub"></span>
      <div class="seg" id="s-hz"><button type="button" data-hz="h1" aria-pressed="true">1시간</button><button type="button" data-hz="close" aria-pressed="false">종가</button></div></div>
    <div class="scs" id="scripts"></div>
    <pre class="code" id="code" hidden></pre>
  </div>

  <div class="panel">
    <div class="ph"><h2>정보원 탐색</h2><span class="vmeta" id="lab-sub"></span></div>
    <div class="lab" id="lab"></div>
  </div>

  <div class="foot"><span id="gen"></span><a href="https://github.com/junghh21/turtle-forecast/blob/main/PREREG.md" target="_blank" rel="noopener">사전등록</a></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const NAMES = { spx: 'S&P 500', ndx: '나스닥', tlt: 'TLT', boil: 'BOIL', kospi: 'KOSPI' };
const PROV = { gemini: 'Gemini', qwen: 'Qwen', deepseek: 'DeepSeek', kimi: 'Kimi', grok: 'Grok' };
const PC = { gemini: 'var(--g)', qwen: 'var(--q)', deepseek: 'var(--d)', kimi: 'var(--k)', grok: 'var(--x)' };
const pct = (x) => x == null ? '–' : Math.round(x * 100) + '%';
const fmtPx = (x) => x == null ? '–' : x >= 1000 ? x.toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 2 }) : x.toFixed(2);
const kst = (iso) => new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
const rel = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? '방금' : m < 60 ? m + '분 전' : m < 2880 ? Math.round(m / 60) + '시간 전' : Math.round(m / 1440) + '일 전'; };
let D = null, SEL = 'spx', FHZ = '1h', CHZ = '1h';
const ON = Object.fromEntries(Object.keys(PROV).map((k) => [k, true]));

function countUp(el, to, fmt) {
  const from = +el.dataset.v || 0; el.dataset.v = to;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const pathLen = (svg) => svg.querySelectorAll('.ln').forEach((p) => p.style.setProperty('--len', Math.ceil(p.getTotalLength())));

function dial(p, label) {
  const has = !!p, v = has ? p.p_up : .5, ang = (v - .5) * 180;
  const col = !has ? 'var(--wait)' : p.dir === 'up' ? 'var(--up)' : 'var(--down)';
  return `<div class="dial"><svg viewBox="0 0 100 58" aria-hidden="true">
    <path d="M8 50 A42 42 0 0 1 92 50" fill="none" stroke="var(--sunk)" stroke-width="9" stroke-linecap="round"/>
    <path d="M8 50 A42 42 0 0 1 50 8" fill="none" stroke="var(--down-soft)" stroke-width="9" stroke-linecap="round"/>
    <path d="M50 8 A42 42 0 0 1 92 50" fill="none" stroke="var(--up-soft)" stroke-width="9" stroke-linecap="round"/>

function spark(s) {
  if (!s || s.length < 2) return '<svg class="spark"></svg>';
  const W = 200, H = 40, ys = s.map((d) => d[1]), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = (i) => i / (s.length - 1) * W, Y = (y) => H - 3 - (y - y0) / ((y1 - y0) || 1) * (H - 6);
  const d = s.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
  const col = ys.at(-1) >= ys[0] ? 'var(--up)' : 'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${W},${H}L0,${H}Z" fill="${col}" opacity=".09"/><path class="ln" d="${d}" fill="none" stroke="${col}" stroke-width="1.7" vector-effect="non-scaling-stroke"/></svg>`;
}

function renderFocus() {
  const a = D.assets.find((x) => x.key === SEL);
  $('f-title').textContent = NAMES[SEL];
  const s = D.series?.[SEL] || [];
  const svg = $('chart');
  const W = svg.clientWidth || 800, H = 300, L = 8, R = 62, T = 14, B = 24;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (s.length < 2) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">–</text>`; renderBoard(); return; }
  const marks = D.predictions.filter((p) => p.parsed?.assets?.[SEL]?.[FHZ] && ON[p.provider]).map((p) => {
    const t = new Date(p.at) / 1000, px = p.assets?.[SEL]?.last?.price;
    return { p, t, px, pr: p.parsed.assets[SEL][FHZ], res: p.result?.[SEL]?.[FHZ] };
  }).filter((m) => m.px != null && m.t >= s[0][0]);
  const xs = s.map((d) => d[0]), ys = [...s.map((d) => d[1]), ...marks.map((m) => m.px)];
  const x0 = xs[0], x1 = Math.max(xs.at(-1), ...marks.map((m) => m.t)), y0 = Math.min(...ys), y1 = Math.max(...ys), pad = (y1 - y0) * .08 || 1;
  const X = (t) => L + (t - x0) / ((x1 - x0) || 1) * (W - L - R), Y = (y) => T + (1 - (y - (y0 - pad)) / ((y1 - y0) + 2 * pad)) * (H - T - B);
  const d = s.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
  const ticks = [0, .25, .5, .75, 1].map((k) => { const v = y0 - pad + k * ((y1 - y0) + 2 * pad); return `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${W - R + 6}" y="${Y(v) + 4}">${fmtPx(v)}</text>`; }).join('');
  const days = []; for (let t = Math.ceil(x0 / 86400) * 86400; t <= x1; t += 86400) days.push(t);
  const xt = days.map((t) => `<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${X(t)}" y="${H - 6}" text-anchor="middle">${new Date(t * 1000).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric' })}</text>`).join('');
  const mk = marks.map((m, i) => {
    const x = X(m.t), y = Y(m.px), up = m.pr.dir === 'up';
    const fill = !m.res ? 'var(--wait)' : m.res.status ? 'var(--wait)' : m.res.hit ? 'var(--up)' : 'var(--down)';
    const tri = up ? `M${x},${y - 13} l6,9 h-12z` : `M${x},${y + 13} l6,-9 h-12z`;
    return `<g class="mk" data-i="${i}" style="transform-origin:${x}px ${y}px"><circle cx="${x}" cy="${y}" r="3.5" fill="${PC[m.p.provider]}"/><path d="${tri}" fill="${fill}"/></g>`;
  }).join('');
  const col = s.at(-1)[1] >= s[0][1] ? 'var(--up)' : 'var(--down)';
  svg.innerHTML = `<defs><linearGradient id="fg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".18"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${ticks}${xt}<path d="${d}L${X(xs.at(-1))},${H - B}L${X(x0)},${H - B}Z" fill="url(#fg)"/><path class="ln" d="${d}" fill="none" stroke="${col}" stroke-width="2"/>
    <circle cx="${X(xs.at(-1))}" cy="${Y(s.at(-1)[1])}" r="4" fill="${col}"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/></circle>
    <line id="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>${mk}`;
  pathLen(svg);
  const tip = $('tip');
  svg.onmousemove = (e) => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * (W / r.width);
    const t = x0 + (mx - L) / (W - L - R) * (x1 - x0);
    const g = e.target.closest('.mk');
    const xh = svg.querySelector('#xh');
    if (g) {
      const m = marks[+g.dataset.i];
      const res = !m.res ? '채점 대기' : m.res.status ? '채점 안 함' : m.res.hit ? '✓ 적중' : '✗ 빗나감';
      tip.innerHTML = `<b style="color:${PC[m.p.provider]}">${PROV[m.p.provider]}</b> · ${kst(m.p.at)}<br>${m.pr.dir === 'up' ? '▲ 상승' : '▼ 하락'} ${pct(m.pr.p_up)} · <b>${res}</b>${m.p.parsed.reason ? `<br><span style="opacity:.8">${esc(m.p.parsed.reason)}</span>` : ''}`;
    } else {
      let best = s[0]; for (const p of s) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
      tip.innerHTML = `<b class="num">${fmtPx(best[1])}</b><br>${kst(new Date(best[0] * 1000).toISOString())}`;
      xh.setAttribute('x1', X(best[0])); xh.setAttribute('x2', X(best[0])); xh.setAttribute('opacity', '.6');
    }
    const pr = svg.parentElement.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX - pr.left + 14, pr.width - 270) + 'px';
    tip.style.top = (e.clientY - pr.top + 14) + 'px';
    tip.classList.add('on');
  };
  svg.onmouseleave = () => { tip.classList.remove('on'); svg.querySelector('#xh')?.setAttribute('opacity', '0'); };
  renderBoard();
}

  $('tiles').querySelectorAll('.v[data-to]').forEach((el) => { const to = +el.dataset.to; countUp(el, to, (x) => x.toLocaleString('en-US', { maximumFractionDigits: to < 50 ? 2 : 1 })); });
  const mxc = Math.max(1, ...(c.explored || []).map((e) => e.chars));
  $('srcs').innerHTML = (c.explored || []).map((e) => `<div class="src"><a href="${esc(e.url)}" target="_blank" rel="noopener" title="${esc(e.excerpt)}">${e.kind === 'article' ? '📰' : '🌐'} ${esc(e.label.replace(/^Article: /, ''))}</a><span class="lenbar" title="${e.chars}자"><i data-w="${e.chars / mxc * 100}"></i></span></div>`).join('')
    + (c.failed || []).map((f) => `<div class="src"><span class="down-t">✗ ${esc(f.label.replace(/^Article: /, ''))}</span><span class="vmeta">${esc(f.why)}</span></div>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => $('srcs').querySelectorAll('i[data-w]').forEach((i) => { i.style.width = i.dataset.w + '%'; })));
}

function renderLab() {
  const C = [...(D.candidates || [])].sort((a, b) => (b.tries ? b.ok / b.tries : -1) - (a.tries ? a.ok / a.tries : -1));
  const tried = C.filter((c) => c.tries).length;
  $('lab-sub').textContent = `${tried}/${C.length}`;
  const og = (o) => o === 'seed' ? '초기' : o?.startsWith('suggest:') ? (PROV[o.slice(8)] || '') + ' 추천' : o?.startsWith('evolve:') ? (PROV[o.slice(7)] || '') + ' 진화' : esc(o);
  $('lab').innerHTML = C.map((c) => {
    const r = c.tries ? c.ok / c.tries : 0, L = 2 * Math.PI * 15;
    const col = !c.tries ? 'var(--wait)' : r >= .67 ? 'var(--up)' : r > 0 ? 'var(--k)' : 'var(--down)';
    return `<a class="cand" href="${esc(c.url)}" target="_blank" rel="noopener"><svg class="ring" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="var(--sunk)" stroke-width="5"/><circle class="fg" cx="20" cy="20" r="15" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L}" data-off="${L * (1 - r)}" transform="rotate(-90 20 20)"/><text x="20" y="24" text-anchor="middle" style="font:600 10px 'IBM Plex Mono';fill:var(--ink)">${c.tries ? c.ok + '/' + c.tries : '–'}</text></svg>
      <span><span class="nm">${esc(c.label)}</span><br><span class="og">${og(c.origin)}${c.avg_chars ? ' · ' + c.avg_chars + '자' : ''}</span></span></a>`;
  }).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => $('lab').querySelectorAll('circle[data-off]').forEach((c) => c.setAttribute('stroke-dashoffset', c.dataset.off))));
}

function tickNext() {
  const n = new Date(); const t = new Date(n); t.setUTCMinutes(7, 0, 0); if (t <= n) t.setUTCHours(t.getUTCHours() + 1);
  const m = Math.floor((t - n) / 60000), s = Math.floor((t - n) / 1000) % 60;
  $('next').querySelector('b').textContent = `${m}:${String(s).padStart(2, '0')}`;
}

function renderAll() { renderTop(); renderCards(); renderFocus(); renderLLMs(); renderCurve(); renderFeed(); renderEvolution(); renderCollected(); renderScripts(); renderLab(); $('gen').textContent = D.generated_at ? kst(D.generated_at) + ' KST' : ''; }

for (const [id, set] of [['f-hz', (v) => { FHZ = v; renderFocus(); }], ['c-hz', (v) => { CHZ = v; renderCurve(); }], ['s-hz', (v) => { SHZ = v; renderScripts(); }]]) {
  $(id).querySelectorAll('button').forEach((b) => { b.onclick = () => { $(id).querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); set(b.dataset.hz); }; });
}
$('theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('theme', r.dataset.theme); } catch {} };
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (D) { renderFocus(); renderCurve(); } }, 150); });

async function load() {
  try {
    const r = await fetch('data/latest.json?ts=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    if (!j.generated_at) throw new Error('empty');
    const changed = !D || D.generated_at !== j.generated_at;
    D = j;
    if (changed) renderAll(); else renderTop();
  } catch (e) { $('live').innerHTML = '<span class="dot"></span>데이터 대기'; }
}
load(); setInterval(load, 120000); tickNext(); setInterval(tickNext, 1000);
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
